<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>いん ゲーム開発</title>
<style>
  :root {
    /* 黒い背景に、スマホのホーム画面のようにアプリアイコンを並べる */
    --bg: #000000;
    --text: #f2f2f2;
    --muted: #8a8a8a;
    --focus: #ffffff;
    --font: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); }
  header { padding: 28px 22px 8px; max-width: 720px; margin: 0 auto; }
  h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: .08em; }
  main { max-width: 720px; margin: 0 auto; padding: 28px 22px 48px;
         display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 28px 20px; }
  .app { display: block; width: 84px; aspect-ratio: 1; border-radius: 22.5%; overflow: hidden; justify-self: start;
         transition: transform .12s ease; }
  .app img { display: block; width: 100%; height: 100%; }
  .app:active { transform: scale(.92); }
  .app:focus-visible { outline: 2px solid var(--focus); outline-offset: 4px; }
  #snow { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  header, main { position: relative; z-index: 1; }
  @media (prefers-reduced-motion: reduce) { .app { transition: none; } }
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>
<script>
  // 雪の結晶がくるくる回りながら落ちてくる背景
  (function () {
    const cv = document.getElementById('snow'), cx = cv.getContext('2d');
    const still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    // 結晶の形を3種類、先に描いておく
    function crystal(type) {
      const S = 64, c = document.createElement('canvas'); c.width = c.height = S;
      const g = c.getContext('2d'); g.translate(S / 2, S / 2);
      g.strokeStyle = '#fff'; g.lineCap = 'round'; g.lineWidth = 3.2;
      g.shadowColor = 'rgba(200,230,255,.9)'; g.shadowBlur = 6;
      for (let i = 0; i < 6; i++) {
        g.save(); g.rotate(i * Math.PI / 3);
        g.beginPath(); g.moveTo(0, 0); g.lineTo(0, -26);
        if (type === 0) {        // 枝が2段
          g.moveTo(0, -10); g.lineTo(-7, -17); g.moveTo(0, -10); g.lineTo(7, -17);
          g.moveTo(0, -18); g.lineTo(-5, -23); g.moveTo(0, -18); g.lineTo(5, -23);
        } else if (type === 1) { // 先がひし形
          g.moveTo(0, -16); g.lineTo(-5, -21); g.lineTo(0, -26); g.lineTo(5, -21); g.lineTo(0, -16);
          g.moveTo(0, -8); g.lineTo(-6, -12); g.moveTo(0, -8); g.lineTo(6, -12);
        } else {                 // シンプルな星形
          g.moveTo(0, -14); g.lineTo(-6, -20); g.moveTo(0, -14); g.lineTo(6, -20);
        }
        g.stroke(); g.restore();
      }
      g.fillStyle = '#fff'; g.beginPath(); g.arc(0, 0, 3.5, 0, Math.PI * 2); g.fill();
      return c;
    }
    const shapes = [crystal(0), crystal(1), crystal(2)];
    let W = 0, H = 0, dpr = 1, flakes = [];
    function make(top) {
      const size = 8 + Math.pow(Math.random(), 1.6) * 22;     // 小さい結晶が多め
      return { x: Math.random() * W, y: top ? -size : Math.random() * H, size,
               vy: 14 + size * 1.6 + Math.random() * 10, sway: 0.4 + Math.random() * 1.2,
               ph: Math.random() * Math.PI * 2, rot: Math.random() * Math.PI, vr: (Math.random() - .5) * 1.4,
               a: 0.45 + Math.random() * 0.55, img: shapes[Math.floor(Math.random() * shapes.length)] };
    }
    function resize() {
      dpr = Math.min(2, window.devicePixelRatio || 1);
      W = innerWidth; H = innerHeight;
      cv.width = W * dpr; cv.height = H * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const n = Math.round(Math.min(90, W * H / 6500));
      flakes = Array.from({ length: n }, () => make(false));
    }
    function draw() {
      cx.setTransform(dpr, 0, 0, dpr, 0, 0);
      cx.clearRect(0, 0, W, H);
      for (const f of flakes) {
        cx.globalAlpha = f.a;
        cx.setTransform(dpr, 0, 0, dpr, f.x * dpr, f.y * dpr);
        cx.rotate(f.rot);
        cx.drawImage(f.img, -f.size / 2, -f.size / 2, f.size, f.size);
      }
      cx.globalAlpha = 1;
    }
    let last = performance.now();
    function tick(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      for (const f of flakes) {
        f.ph += dt * f.sway;
        f.y += f.vy * dt;
        f.x += Math.sin(f.ph) * 18 * dt;
        f.rot += f.vr * dt;
        if (f.y > H + f.size) Object.assign(f, make(true));
        if (f.x < -f.size) f.x = W + f.size; else if (f.x > W + f.size) f.x = -f.size;
      }
      draw();
      requestAnimationFrame(tick);
    }
    addEventListener('resize', resize);
    resize();
    if (still) draw(); else requestAnimationFrame(tick);
  })();
</script>
